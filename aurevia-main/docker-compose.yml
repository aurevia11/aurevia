services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL in .env}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      COMPLAINTS_EMAIL: ${COMPLAINTS_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:-}
      VERIFICATION_EMAIL_API_URL: ${VERIFICATION_EMAIL_API_URL:-}
      VERIFICATION_EMAIL_API_KEY: ${VERIFICATION_EMAIL_API_KEY:-}
      VERIFICATION_SMS_API_URL: ${VERIFICATION_SMS_API_URL:-}
      VERIFICATION_SMS_API_KEY: ${VERIFICATION_SMS_API_KEY:-}
      PHONE_VERIFICATION_REQUIRED: ${PHONE_VERIFICATION_REQUIRED:-false}
      REAL_EXECUTION_ENABLED: ${REAL_EXECUTION_ENABLED:-false}
      ALPACA_PROVIDER: ${ALPACA_PROVIDER:-}
      ALPACA_TRADING_BASE_URL: ${ALPACA_TRADING_BASE_URL:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_ACCOUNT_ID: ${ALPACA_ACCOUNT_ID:-}
      ALPACA_WEBHOOK_SECRET: ${ALPACA_WEBHOOK_SECRET:-}
      ALPACA_BROKER_BASE_URL: ${ALPACA_BROKER_BASE_URL:-}
      ALPACA_BROKER_CLIENT_ID: ${ALPACA_BROKER_CLIENT_ID:-}
      ALPACA_BROKER_CLIENT_SECRET: ${ALPACA_BROKER_CLIENT_SECRET:-}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-}
      BROKER_API_URL: ${BROKER_API_URL:-}
      BROKER_API_KEY: ${BROKER_API_KEY:-}
      BROKER_ACCOUNT_ID: ${BROKER_ACCOUNT_ID:-}
      BROKER_WEBHOOK_SECRET: ${BROKER_WEBHOOK_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_API_URL: ${PAYMENT_API_URL:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      MARKET_DATA_API_URL: ${MARKET_DATA_API_URL:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      MARKET_TICK_MS: ${MARKET_TICK_MS:-2500}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3000:3000"]
volumes:
  pgdata:
